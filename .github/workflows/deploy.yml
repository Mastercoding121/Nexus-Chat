name: Deploy to Vercel

on:
  push:
    branches:
      - main

# Configure these as GitHub repository secrets:
# VERCEL_TOKEN: the provided Vercel access token
# VERCEL_ORG_ID: cdPe7oEsf6UYW0zJXm8jaZu0
# VERCEL_PROJECT_ID: prj_3GbRWyUwSWTxKQMaxr3GYJ7XP29P

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production checks
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"