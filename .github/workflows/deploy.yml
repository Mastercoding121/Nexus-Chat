name: Deploy to Vercel

# Production deployments run through this workflow.

on:
  push:
    branches:
      - main

# Configure these as GitHub repository secrets:
# VERCEL_TOKEN: the provided Vercel access token
# VERCEL_ORG_ID: cdPe7oEsf6UYW0zJXm8jaZu0
# VERCEL_PROJECT_ID: prj_3GbRWyUwSWTxKQMaxr3GYJ7XP29P
# SUPABASE_DB_URL: Supabase Postgres connection string for schema sync

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production checks
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Configure Vercel database connection
        run: printf '%s' "$SUPABASE_DB_URL" | vercel env add SUPABASE_DB_URL production --force --sensitive --yes --token="$VERCEL_TOKEN"

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifacts to Vercel
        id: deploy
        run: |
          deployment_url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -n 1)
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Alias deployment to stable production URL
        run: vercel alias set "${{ steps.deploy.outputs.deployment_url }}" nexus-chat-git-main-big-hit.vercel.app --token="$VERCEL_TOKEN"